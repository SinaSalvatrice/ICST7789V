name: Build UF2 (self-hosted)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout ICST7789V
        uses: actions/checkout@v4

      - name: Build UF2 on Kampfzwerg
        shell: cmd
        run: call build_uf2.bat

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ICST7789V-UF2
          path: build\ICST7789V.uf2
          if-no-files-found: error
